# Builds the client extensions in liferay-workspace and publishes each one's
# workload image and descriptor image to the registry that
# liferay-workspace/gradle.properties names, such as ghcr.io/<owner>/<path>.
#
# Each client extension's version is the version in its own gradle.properties,
# such as liferay-workspace/client-extensions/<name>/gradle.properties. A
# push to master that changes liferay-workspace publishes every client
# extension whose version is not in the registry yet, so a new client
# extension, or one whose version was raised, is published and the rest are
# left alone. A version that is already published is never published again,
# since an environment that uses it would silently get different code. Put the
# published version in liferay.yaml.
#
# The workflow cannot make the packages public: GitHub has no API for a
# package's visibility. The run's summary links each new package's settings
# page, where Change visibility makes it public. That is needed once per
# package, since later versions keep the package's visibility.

name: Publish Client Extensions

on:
    push:
        branches:
            -   master
        paths:
            -   liferay-workspace/**
    workflow_dispatch:

concurrency:
    cancel-in-progress: false
    group: publish-client-extensions

permissions:
    contents: read
    packages: write

jobs:
    publish:
        defaults:
            run:
                shell: bash
                working-directory: liferay-workspace
        runs-on: ubuntu-latest
        steps:
            -   name: Check out
                uses: actions/checkout@v4
            -   name: Set up Java
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "21"
            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@v3
                with:
                    password: ${{ secrets.GITHUB_TOKEN }}
                    registry: ghcr.io
                    username: ${{ github.actor }}
            -   name: Choose the client extensions to publish
                run: |
                    registry=$(sed --quiet 's/^liferay\.workspace\.client\.extension\.registry=//p' gradle.properties)

                    tasks=()

                    for client_extension_dir in client-extensions/*/
                    do
                        name=$(basename "${client_extension_dir}")

                        version=""

                        if [[ -f "${client_extension_dir}gradle.properties" ]]
                        then
                            version=$(sed --quiet 's/^version=//p' "${client_extension_dir}gradle.properties")
                        fi

                        if [[ -z "${version}" ]]
                        then
                            echo "${name} has no version. Set version in ${client_extension_dir}gradle.properties." >&2

                            exit 1
                        fi

                        if docker manifest inspect "${registry}/${name}-descriptor:${version}" > /dev/null 2>&1
                        then
                            echo "${name} ${version}" >> already-published.txt
                        else
                            tasks+=(":client-extensions:${name}:publishClientExtension")
                        fi
                    done

                    echo "PUBLISH_TASKS=${tasks[*]}" >> "${GITHUB_ENV}"
            -   name: Publish client extensions
                if: env.PUBLISH_TASKS != ''
                run: |
                    ./gradlew ${PUBLISH_TASKS} | tee publish.log
            -   name: Summarize packages
                env:
                    OWNER_TYPE: ${{ github.event.repository.owner.type }}
                run: |
                    if [[ "${OWNER_TYPE}" == "Organization" ]]
                    then
                        owner_path="orgs/${GITHUB_REPOSITORY_OWNER}"
                    else
                        owner_path="users/${GITHUB_REPOSITORY_OWNER}"
                    fi

                    touch already-published.txt publish.log

                    # Each descriptor's digest tag, <version>.<12 hex>, pins
                    # this exact build when it is a client extension's version
                    # in liferay.yaml.

                    descriptors=$(
                        grep --only-matching '^Pushed [^ ]*-descriptor:[^@ ]*\.[0-9a-f]\{12\}@' publish.log \
                            | sed --regexp-extended 's|^Pushed (.*)/([^/]+)-descriptor:([^@]+)@$|\2 \3 \1/\2-descriptor|' \
                            | sort --unique \
                            || true)

                    {
                        echo "clientExtensions:"

                        while read -r name pinned_version descriptor
                        do
                            if [[ -n "${name}" ]]
                            then
                                echo "  ${name}:"
                                echo "    descriptor: oci://${descriptor}"
                                echo "    version: ${pinned_version}"
                            fi
                        done <<< "${descriptors}"
                    } > client-extension-versions.yaml

                    {
                        echo "## Published"
                        echo ""

                        if [[ -z "${descriptors}" ]]
                        then
                            echo "Nothing new. Every client extension's version is already published."
                        else
                            echo '```'

                            while read -r name pinned_version descriptor
                            do
                                echo "${descriptor}:${pinned_version}"
                            done <<< "${descriptors}"

                            echo '```'
                            echo ""
                            echo "To deploy this build, merge this into \`clientExtensions\` in a \`liferay.yaml\`, in \`base\` for every environment or in one environment's. A new client extension also needs its \`values\`, such as its network and domain."
                            echo ""
                            echo '```yaml'
                            cat client-extension-versions.yaml
                            echo '```'
                        fi

                        echo ""

                        if [[ -s already-published.txt ]]
                        then
                            echo "## Already Published"
                            echo ""
                            echo "To publish one of these again, raise the version in its \`gradle.properties\`."
                            echo ""

                            while read -r name version
                            do
                                echo "- \`${name}\` ${version}"
                            done < already-published.txt

                            echo ""
                        fi

                        if [[ -n "${descriptors}" ]]
                        then
                            echo "## Make New Packages Public"
                            echo ""
                            echo "New packages are private. Open each one's settings, choose **Change visibility**, and select **Public**:"
                            echo ""

                            grep '^Pushed ' publish.log \
                                | sed --regexp-extended 's|^Pushed ghcr\.io/[^/]+/([^:@]+).*|\1|' \
                                | sort --unique \
                                | while read -r package
                                do
                                    echo "- [${package}](https://github.com/${owner_path}/packages/container/${package//\//%2F}/settings)"
                                done
                        fi
                    } >> "${GITHUB_STEP_SUMMARY}"
            -   name: Upload client extension versions
                if: env.PUBLISH_TASKS != ''
                uses: actions/upload-artifact@v4
                with:
                    name: client-extension-versions-${{ github.run_number }}
                    path: liferay-workspace/client-extension-versions.yaml
