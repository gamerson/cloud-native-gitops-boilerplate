# Teardown: allow Crossplane to delete the database and the storage buckets.
forceDestroy: true

backup:
  enabled: true
  frequency: Daily
  timeOfDay: "10:45"
  timeZone: America/Chicago
  retentionDays: 7

endpoints:
  runray.xyz:
    hostname: "*.runray.xyz"
    port: 443
    protocol: HTTPS
    tls:
      externalSecretKeys:
        - "liferay-certificates-runrayxyz"

# license:
#   externalSecretKey: "liferay-licenses-developer-clustered"
#   targetSecretName: "developer-clustered"

overlayAccess:
  enabled: true

# DXP 2026.q3.0 requires OpenSearch 2.19 or later. The chart still provisions
# 2.15, which the search engine rejects at startup.
search:
  opensearch:
    version: "2.19"

# enable below on GCP
#search:
  #elasticsearch:
    #version: 8.19.21
