clientExtensions:
  liferay-sample-global-css-1:
    descriptor: oci://ghcr.io/gamerson/lcd-53904/liferay-sample-global-css-1-descriptor
    enabled: false
    values:
      network:
        enabled: true
        endpointRef: runray.xyz
    version: 1.0.0.171498b439d2
  liferay-sample-batch:
    descriptor: oci://ghcr.io/gamerson/lcd-53904/liferay-sample-batch-descriptor
    enabled: false
    version: 1.0.2
  liferay-sample-custom-element-2:
    descriptor: oci://ghcr.io/gamerson/lcd-53904/liferay-sample-custom-element-2-descriptor
    enabled: false
    values:
      network:
        enabled: true
        endpointRef: runray.xyz
    version: 1.0.2
  liferay-sample-etc-cron:
    descriptor: oci://ghcr.io/gamerson/lcd-53904/liferay-sample-etc-cron-descriptor
    enabled: false
    values:
      workload:
        kind: CronJob
        schedule: "*/15 * * * *"
    version: 1.0.2
  liferay-sample-etc-node:
    descriptor: oci://ghcr.io/gamerson/lcd-53904/liferay-sample-etc-node-descriptor
    enabled: false
    values:
      imagePullSecrets:
        - name: ghcr-pull
      network:
        enabled: true
        endpointRef: runray.xyz
      workload:
        containerPort: 3001
    version: 1.0.3
  liferay-sample-etc-spring-boot:
    descriptor: oci://ghcr.io/gamerson/lcd-53904/liferay-sample-etc-spring-boot-descriptor
    enabled: false
    values:
      network:
        enabled: true
        endpointRef: runray.xyz
      workload:
        containerPort: 58081
    version: 1.0.3

liferay-default:
  clientExtensions:
    delivery:
      enabled: true
  networkPolicy:
    extraIngress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
        ports:
          - port: 12345
            protocol: TCP
  customEnv:
  image:
    repository: liferay/dxp
    tag: 2026.q3.5
  licensing:
    dxpVersion: 2026.q3.0
    enabled: true
    onlineActivationWorkflow:
      enabled: true
    syncInterval: 5
  marketplace:
    enabled: true
    syncInterval: 5
