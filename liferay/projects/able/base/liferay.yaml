  #       secret:
  #         items:
  #           - key: license.xml
  #             path: license.xml
  #         secretName: developer-clustered
  image:
    tag: 2026.q3.0
    #tag: 2025.q1.24-lts
 
  licensing:
    enabled: true
    onlineActivationWorkflow:
      enabled: true
    syncInterval: 5
  marketplace:
    enabled: true
    syncInterval: 5
