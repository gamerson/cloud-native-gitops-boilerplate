clientExtensions:
  - chart: oci://ghcr.io/gamerson/lcd-53966/charts/liferay-sample-batch
    version: 0.0.0-gc823be5a92c6
  - chart: oci://ghcr.io/gamerson/lcd-53966/charts/liferay-sample-custom-element-2
    version: 0.0.0-g2daf89891075
    values:
      clientExtension:
        domain: custom-element-2-able-nonproduction.runray.xyz
      network:
        enabled: true
        endpointRef: runray.xyz
  - chart: oci://ghcr.io/gamerson/lcd-53966/charts/liferay-sample-etc-spring-boot
    version: 0.0.0-g2c4ba6e80eea
    values:
      clientExtension:
        domain: etc-spring-boot-able-nonproduction.runray.xyz
      network:
        enabled: true
        endpointRef: runray.xyz
  - chart: oci://ghcr.io/gamerson/lcd-53966/charts/liferay-sample-global-css-1
    version: 0.0.0-ge235e159e8a0
    values:
      clientExtension:
        domain: global-css-1-able-nonproduction.runray.xyz
      network:
        enabled: true
        endpointRef: runray.xyz
  - chart: oci://ghcr.io/gamerson/lcd-53966/charts/liferay-sample-instance-settings
    version: 0.0.0-g1ba8099f2aca

liferay-default:
  customEnv:
    # The Gateway redirects HTTP to HTTPS, so DXP must advertise https in its
    # lxc-dxp-metadata ConfigMap, or client extensions calling it get a 301.
    x-web-server-protocol:
      - name: LIFERAY_WEB_PERIOD_SERVER_PERIOD_PROTOCOL
        value: https
  network:
    enabled: true
    endpointRef: runray.xyz
    forceHttpsRedirect: true
    hostnames:
      - "liferay-able-nonproduction.runray.xyz"
  overlay:
    copy:
      - from: "build_1/*"
        into: "osgi/modules/"
    enabled: true
    type: s3
  replicaCount: 1
  # EKS Auto Mode sizes the node from the request, so the chart's 4Gi request
  # bought a c6a.xlarge that the 12Gi limit can never fit on. Asking for 8Gi
  # gets a c6a.2xlarge, where the limit is real and the node stops thrashing.
  resources:
    limits:
      memory: 12Gi
    requests:
      memory: 8Gi
  # A first boot against an empty database runs every verify process before
  # Liferay answers a request, which overran the chart's 15 minute budget
  # (60s + 90 x 10s) and got the container killed partway through.
  startupProbe:
    failureThreshold: 240
