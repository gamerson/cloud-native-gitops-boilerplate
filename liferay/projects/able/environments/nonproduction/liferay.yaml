clientExtensions:
  # Split-namespace test: a hand-made Argo CD Application runs etc-cron in
  # liferay-able-cx-nonproduction instead.
  liferay-sample-etc-cron:
    enabled: false
  liferay-sample-global-css-1:
    values:
      clientExtension:
        domain: global-css-1-able-nonproduction.runray.xyz
  liferay-sample-custom-element-2:
    values:
      clientExtension:
        domain: custom-element-2-able-nonproduction.runray.xyz
    version: 1.0.2.8c080d14bb0e
  liferay-sample-etc-node:
    values:
      clientExtension:
        domain: etc-node-able-nonproduction.runray.xyz
  liferay-sample-etc-spring-boot:
    values:
      clientExtension:
        domain: etc-spring-boot-able-nonproduction.runray.xyz
    version: 1.0.5.d59b3753e64c

liferay-default:
  clientExtensions:
    policy:
      allowedNamespaces:
        - liferay-able-cx-nonproduction
  customEnv:
    x-web-server-protocol:
      - name: LIFERAY_WEB_PERIOD_SERVER_PERIOD_PROTOCOL
        value: https
  network:
    enabled: true
    endpointRef: runray.xyz
    forceHttpsRedirect: true
    hostnames:
      - "liferay-able-nonproduction.runray.xyz"
  overlay:
    copy:
      - from: "build_1/*"
        into: "osgi/modules/"
    enabled: true
    type: s3
  replicaCount: 1
  resources:
    limits:
      memory: 12Gi
    requests:
      memory: 8Gi
  startupProbe:
    failureThreshold: 240
