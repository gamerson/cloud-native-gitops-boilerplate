enabled: true
liferay-dxp-operator:
  # Shortened for the demo, so a change is picked up in about a minute rather
  # than ten. The default is 10m.
  heartbeatInterval: 1m
  image:
    repository: us-central1-docker.pkg.dev/external-assets-nonprd/liferay-cloud-native/release-lcd-53126/b1c1b7d/liferay-dxp-operator
    tag: "0.1.0"
  provisioning:
    baseURL: https://api.one-uat.liferay.com
  retry:
    # Shortened for the demo so a failing add-on retries within a couple of
    # minutes instead of backing off toward half an hour. The default is 30m.
    maxDelay: 2m
